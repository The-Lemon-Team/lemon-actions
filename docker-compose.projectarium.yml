services:
  postgres:
    image: postgres:16-alpine
    container_name: lemon-projectarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lemon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lemon_projectarium_db}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - lemon_projectarium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon_projectarium_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lemon-projectarium-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-lemon_secret}@postgres:5432/${POSTGRES_DB:-lemon_projectarium_db}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AUTO_SEED: ${AUTO_SEED:-false}
      PROJECTARIUM_LOCALHOST_ALIAS: ${PROJECTARIUM_LOCALHOST_ALIAS:-host.docker.internal}
      NATS_URL: ${NATS_URL:-nats://host.docker.internal:4222}
      LEMON_BUS_DRIVER: ${LEMON_BUS_DRIVER:-auto}
      LEMON_SHARD_PROJECT_SLUG: ${LEMON_SHARD_PROJECT_SLUG:-lemon-projectarium}
      LEMON_ANALYTICS_CONSUMER: ${LEMON_ANALYTICS_CONSUMER:-projectarium_shard_analytics}
      LEMON_SEASONS_URL: ${LEMON_SEASONS_URL:-http://host.docker.internal:3001}
      LEMON_MEDIA_HUB_URL: ${LEMON_MEDIA_HUB_URL:-http://host.docker.internal:3005}
      LEMON_AI_SERVICE_URL: ${LEMON_AI_SERVICE_URL:-http://host.docker.internal:3006}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,nats,host.docker.internal,192.168.1.100,100.72.50.18}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,postgres,nats,host.docker.internal,192.168.1.100,100.72.50.18}
    ports:
      - "${API_PORT:-3200}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_CONFIG: ${WEB_BUILD_CONFIG:-projectarium-production}
    container_name: lemon-projectarium-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"
      - "${WEB_PORT_ALT:-4205}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lemon_projectarium_pgdata:
