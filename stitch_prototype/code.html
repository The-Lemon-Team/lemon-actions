<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Resource Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans / Inter for that rounded Google Sans domestic feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons UMD CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            atom: {
              bg: '#fafafa',
              card: '#ffffff',
              sidebar: '#f3f4f6',
              text: '#383a42',
              muted: '#a0a1a7',
              border: '#e5e7eb',
              blue: '#4078f2',
              cyan: '#0184bc',
              green: '#50a14f',
              red: '#e45649',
              yellow: '#c18401',
              amber: '#e5c07b',
              purple: '#a626a4',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      color: #383a42;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom smooth scroll and subtle transition */
    .transition-all-card {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* Pulse badge animation for low stock */
    @keyframes subtle-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-subtle-pulse {
      animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-[#383a42] min-h-screen antialiased selection:bg-blue-100 selection:text-blue-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Initial dummy data with rooms, items, stock thresholds, and units
    const INITIAL_ROOMS = [
      {
        id: 'kitchen',
        name: 'Kitchen',
        icon: 'utensils',
        badgeColor: 'bg-amber-50 text-amber-700 border-amber-200',
        items: [
          { id: 'k-1', name: 'Coffee Beans', qty: 6, maxQty: 10, unit: 'bags', daysPerUnit: 4, category: 'Beverage' },
          { id: 'k-2', name: 'Fresh Milk', qty: 2, maxQty: 5, unit: 'cartons', daysPerUnit: 3, category: 'Dairy' },
          { id: 'k-3', name: 'Cane Sugar', qty: 8, maxQty: 10, unit: 'kg', daysPerUnit: 12, category: 'Pantry' },
          { id: 'k-4', name: 'Green Tea Bags', qty: 15, maxQty: 25, unit: 'boxes', daysPerUnit: 3, category: 'Beverage' },
          { id: 'k-5', name: 'Olive Oil', qty: 1, maxQty: 4, unit: 'bottles', daysPerUnit: 18, category: 'Pantry' }
        ]
      },
      {
        id: 'bathroom',
        name: 'Bathroom',
        icon: 'bath',
        badgeColor: 'bg-blue-50 text-blue-700 border-blue-200',
        items: [
          { id: 'b-1', name: 'Herbal Shampoo', qty: 1, maxQty: 5, unit: 'bottles', daysPerUnit: 14, category: 'Hygiene' },
          { id: 'b-2', name: 'Moisturizing Soap', qty: 4, maxQty: 8, unit: 'bars', daysPerUnit: 8, category: 'Hygiene' },
          { id: 'b-3', name: 'Toilet Paper Pack', qty: 0, maxQty: 12, unit: 'rolls', daysPerUnit: 2.5, category: 'Essentials' },
          { id: 'b-4', name: 'Fluoride Toothpaste', qty: 2, maxQty: 4, unit: 'tubes', daysPerUnit: 20, category: 'Dental' }
        ]
      },
      {
        id: 'living-room',
        name: 'Living Room',
        icon: 'sofa',
        badgeColor: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        items: [
          { id: 'l-1', name: 'AA Batteries (Remotes)', qty: 6, maxQty: 12, unit: 'cells', daysPerUnit: 25, category: 'Tech' },
          { id: 'l-2', name: 'Scented Soy Candle', qty: 2, maxQty: 4, unit: 'jars', daysPerUnit: 15, category: 'Cozy' },
          { id: 'l-3', name: 'Microfiber Duster Cloths', qty: 5, maxQty: 6, unit: 'packs', daysPerUnit: 30, category: 'Cleaning' }
        ]
      },
      {
        id: 'laundry',
        name: 'Laundry & Utility',
        icon: 'sparkles',
        badgeColor: 'bg-purple-50 text-purple-700 border-purple-200',
        items: [
          { id: 'u-1', name: 'Eco Detergent Pods', qty: 8, maxQty: 30, unit: 'pods', daysPerUnit: 1.5, category: 'Laundry' },
          { id: 'u-2', name: 'Fabric Softener', qty: 0, maxQty: 3, unit: 'bottles', daysPerUnit: 21, category: 'Laundry' }
        ]
      }
    ];

    // Helper component for Lucide Icons
    function Icon({ name, size = 18, className = "" }) {
      // Map names to simple inline SVG paths for maximum stability and speed
      switch (name) {
        case 'home':
        case 'all':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          );
        case 'bath':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-1-1.5C4.7 2 4 2.7 4 3.5V6"/>
              <path d="M4 12h16a2 2 0 0 1 2 2v2a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4v-2a2 2 0 0 1 2-2Z"/>
              <path d="M6 12V8a2 2 0 0 1 2-2h1"/>
              <path d="m7 20-1.5 2"/>
              <path d="m17 20 1.5 2"/>
            </svg>
          );
        case 'utensils':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/>
              <path d="M15 11v11"/>
              <path d="M5 2v10a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V2"/>
              <path d="M8 15v7"/>
            </svg>
          );
        case 'sofa':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/>
              <path d="M2 11v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H6v-2a2 2 0 0 0-4 0Z"/>
              <path d="M4 18v2"/>
              <path d="M20 18v2"/>
              <path d="M12 4v9"/>
            </svg>
          );
        case 'sparkles':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
            </svg>
          );
        case 'plus':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          );
        case 'minus':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          );
        case 'alert':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          );
        case 'search':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          );
        case 'shopping':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <circle cx="8" cy="21" r="1"/>
              <circle cx="19" cy="21" r="1"/>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
            </svg>
          );
        case 'bell':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
          );
        case 'check':
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          );
        default:
          return <span className={`inline-block w-4 h-4 bg-gray-400 rounded-full ${className}`} />;
      }
    }

    function App() {
      const [rooms, setRooms] = useState(INITIAL_ROOMS);
      const [selectedNav, setSelectedNav] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [quickFilter, setQuickFilter] = useState('all'); // all, low, empty
      const [notificationToast, setNotificationToast] = useState(null);

      // Trigger temporary toast
      const triggerToast = (msg, type = 'info') => {
        setNotificationToast({ msg, type });
        setTimeout(() => setNotificationToast(null), 3000);
      };

      // Increase quantity
      const handleIncrease = (roomId, itemId) => {
        setRooms(prevRooms =>
          prevRooms.map(room => {
            if (room.id !== roomId) return room;
            return {
              ...room,
              items: room.items.map(item => {
                if (item.id !== itemId) return item;
                const newQty = item.qty + 1;
                return { ...item, qty: newQty };
              })
            };
          })
        );
      };

      // Decrease quantity (safe guard at 0)
      const handleDecrease = (roomId, itemId) => {
        setRooms(prevRooms =>
          prevRooms.map(room => {
            if (room.id !== roomId) return room;
            return {
              ...room,
              items: room.items.map(item => {
                if (item.id !== itemId) return item;
                if (item.qty <= 0) return item;
                const newQty = item.qty - 1;
                if (newQty === 0) {
                  triggerToast(`${item.name} is now depleted! Added to shopping reminder.`, 'alert');
                }
                return { ...item, qty: newQty };
              })
            };
          })
        );
      };

      // Reset / Restock all items to full
      const handleRestockRoom = (roomId) => {
        setRooms(prevRooms =>
          prevRooms.map(room => {
            if (room.id !== roomId) return room;
            return {
              ...room,
              items: room.items.map(item => ({ ...item, qty: item.maxQty }))
            };
          })
        );
        triggerToast(`Restocked all items in this room to maximum!`, 'success');
      };

      // Overall stats
      const stats = useMemo(() => {
        let totalItems = 0;
        let emptyItems = 0;
        let lowItems = 0;
        let healthyItems = 0;

        rooms.forEach(r => {
          r.items.forEach(i => {
            totalItems++;
            const pct = (i.qty / i.maxQty) * 100;
            if (i.qty === 0) emptyItems++;
            else if (pct < 20) lowItems++;
            else healthyItems++;
          });
        });

        return { totalItems, emptyItems, lowItems, healthyItems };
      }, [rooms]);

      // Filtered rooms
      const filteredRooms = useMemo(() => {
        return rooms
          .filter(room => {
            if (selectedNav === 'all') return true;
            return room.id === selectedNav;
          })
          .map(room => {
            // Filter by search query and quick filters
            const items = room.items.filter(item => {
              const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    item.category.toLowerCase().includes(searchQuery.toLowerCase());
              if (!matchesSearch) return false;

              const pct = (item.qty / item.maxQty) * 100;
              if (quickFilter === 'empty') return item.qty === 0;
              if (quickFilter === 'low') return item.qty > 0 && pct < 20;
              if (quickFilter === 'urgent') return pct <= 20; // 0 or < 20%
              return true;
            });

            return { ...room, items };
          })
          .filter(room => room.items.length > 0 || (searchQuery === '' && quickFilter === 'all'));
      }, [rooms, selectedNav, searchQuery, quickFilter]);

      // Navigation Items configuration (Google Keep style)
      const navLinks = [
        { id: 'all', label: 'All Resources', icon: 'all', count: stats.totalItems },
        { id: 'kitchen', label: 'Kitchen', icon: 'utensils', count: rooms.find(r => r.id === 'kitchen')?.items.length || 0 },
        { id: 'bathroom', label: 'Bathroom', icon: 'bath', count: rooms.find(r => r.id === 'bathroom')?.items.length || 0 },
        { id: 'living-room', label: 'Living Room', icon: 'sofa', count: rooms.find(r => r.id === 'living-room')?.items.length || 0 },
        { id: 'laundry', label: 'Laundry & Utility', icon: 'sparkles', count: rooms.find(r => r.id === 'laundry')?.items.length || 0 },
      ];

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#fafafa] font-sans antialiased text-[#383a42]">
          
          {/* LEFT SIDEBAR (Google Keep style rounded menu) */}
          <aside className="w-64 flex-shrink-0 bg-[#f8f9fa] border-r border-[#e5e7eb] flex flex-col justify-between p-4 select-none">
            <div>
              {/* App Brand Header */}
              <div className="flex items-center gap-3 px-3 py-3 mb-4">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#4078f2] to-[#50a14f] text-white flex items-center justify-center shadow-sm">
                  <Icon name="home" size={22} className="stroke-white" />
                </div>
                <div>
                  <h1 className="font-bold text-base tracking-tight text-[#24252a] leading-tight">
                    Hearth & Supply
                  </h1>
                  <p className="text-xs text-[#6a6c76] font-medium">Home Resource Tracker</p>
                </div>
              </div>

              {/* Quick Status Pill */}
              <div className="mx-2 mb-5 p-3 rounded-2xl bg-white border border-[#e5e7eb] shadow-sm">
                <div className="flex items-center justify-between text-xs font-semibold text-[#5c5f6a] mb-2">
                  <span>Home Stock Health</span>
                  <span className="text-[#50a14f]">
                    {Math.round(((stats.healthyItems) / (stats.totalItems || 1)) * 100)}% Good
                  </span>
                </div>
                <div className="w-full bg-[#f0f1f3] h-2 rounded-full overflow-hidden flex">
                  <div 
                    style={{ width: `${(stats.healthyItems / stats.totalItems) * 100}%` }} 
                    className="bg-[#50a14f] h-full transition-all duration-500" 
                    title="Healthy stock"
                  />
                  <div 
                    style={{ width: `${(stats.lowItems / stats.totalItems) * 100}%` }} 
                    className="bg-[#c18401] h-full transition-all duration-500" 
                    title="Low stock"
                  />
                  <div 
                    style={{ width: `${(stats.emptyItems / stats.totalItems) * 100}%` }} 
                    className="bg-[#e45649] h-full transition-all duration-500" 
                    title="Depleted"
                  />
                </div>
                <div className="mt-2.5 flex items-center justify-between text-[11px] text-[#6a6c76]">
                  <span className="flex items-center gap-1 font-medium">
                    <span className="w-2 h-2 rounded-full bg-[#e45649]"></span> {stats.emptyItems} Empty
                  </span>
                  <span className="flex items-center gap-1 font-medium">
                    <span className="w-2 h-2 rounded-full bg-[#c18401]"></span> {stats.lowItems} Low
                  </span>
                  <span className="flex items-center gap-1 font-medium">
                    <span className="w-2 h-2 rounded-full bg-[#50a14f]"></span> {stats.healthyItems} OK
                  </span>
                </div>
              </div>

              {/* Navigation Links (Google Keep Style Pill list) */}
              <nav className="space-y-1">
                <div className="px-3 pb-1 text-[11px] font-bold uppercase tracking-wider text-[#91939d]">
                  Locations
                </div>
                {navLinks.map((link) => {
                  const isActive = selectedNav === link.id;
                  return (
                    <button
                      key={link.id}
                      onClick={() => setSelectedNav(link.id)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-full text-sm font-medium transition-all ${
                        isActive
                          ? 'bg-[#e5efff] text-[#4078f2] shadow-sm font-semibold'
                          : 'text-[#4f525c] hover:bg-[#eaecef] active:bg-[#e2e4e8]'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <Icon 
                          name={link.icon} 
                          size={18} 
                          className={isActive ? 'stroke-[#4078f2]' : 'stroke-[#6a6c76]'} 
                        />
                        <span>{link.label}</span>
                      </div>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-mono ${
                        isActive ? 'bg-[#d0e2ff] text-[#2c65e2]' : 'bg-[#e5e7eb] text-[#6a6c76]'
                      }`}>
                        {link.count}
                      </span>
                    </button>
                  );
                })}
              </nav>

              {/* Quick Filters */}
              <div className="mt-6 pt-4 border-t border-[#e5e7eb]">
                <div className="px-3 pb-2 text-[11px] font-bold uppercase tracking-wider text-[#91939d]">
                  Focus View
                </div>
                <div className="space-y-1">
                  <button
                    onClick={() => setQuickFilter(quickFilter === 'urgent' ? 'all' : 'urgent')}
                    className={`w-full flex items-center justify-between px-3.5 py-2 rounded-full text-xs font-medium transition-all ${
                      quickFilter === 'urgent'
                        ? 'bg-rose-100 text-[#e45649] font-bold'
                        : 'text-[#5c5f6a] hover:bg-[#eaecef]'
                    }`}
                  >
                    <div className="flex items-center gap-2">
                      <Icon name="alert" size={15} className="stroke-[#e45649]" />
                      <span>Needs Shopping</span>
                    </div>
                    {(stats.emptyItems + stats.lowItems) > 0 && (
                      <span className="w-5 h-5 rounded-full bg-[#e45649] text-white flex items-center justify-center text-[10px] font-bold animate-subtle-pulse">
                        {stats.emptyItems + stats.lowItems}
                      </span>
                    )}
                  </button>
                </div>
              </div>
            </div>

            {/* Sidebar Footer info */}
            <div className="p-3 bg-white border border-[#e5e7eb] rounded-2xl shadow-sm text-xs text-[#6a6c76] flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-[#f3f4f6] flex items-center justify-center text-[#50a14f]">
                <Icon name="shopping" size={16} />
              </div>
              <div className="overflow-hidden">
                <p className="font-semibold text-[#24252a] truncate">Pantry Auto-estimate</p>
                <p className="text-[11px] text-[#91939d] truncate">Syncs with daily usage</p>
              </div>
            </div>
          </aside>

          {/* MAIN WORKSPACE */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-[#fafafa]">
            
            {/* Top Bar with Search & Quick Action Buttons */}
            <header className="h-16 border-b border-[#e5e7eb] bg-white px-8 flex items-center justify-between flex-shrink-0 z-10 shadow-sm">
              <div className="flex items-center gap-4 flex-1 max-w-xl">
                {/* Search Bar with Google rounded pill look */}
                <div className="relative w-full">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#91939d]">
                    <Icon name="search" size={17} />
                  </div>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search pantry items, milk, toilet paper, detergent..."
                    className="w-full pl-10 pr-4 py-2 bg-[#f3f4f6] hover:bg-[#eeeff2] focus:bg-white text-sm text-[#383a42] rounded-full border border-transparent focus:border-[#4078f2] focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-[#9ca3af]"
                  />
                  {searchQuery && (
                    <button 
                      onClick={() => setSearchQuery('')}
                      className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs text-[#91939d] hover:text-[#383a42]"
                    >
                      Clear
                    </button>
                  )}
                </div>
              </div>

              {/* Right Action Header controls */}
              <div className="flex items-center gap-3">
                {quickFilter !== 'all' && (
                  <span className="text-xs bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1 rounded-full font-medium flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                    Filter: Needs Restock
                    <button onClick={() => setQuickFilter('all')} className="ml-1 hover:text-rose-900 font-bold">×</button>
                  </span>
                )}
                
                <div className="h-6 w-px bg-gray-200 mx-1"></div>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => {
                      triggerToast('Shopping list exported to clipboard!', 'success');
                    }}
                    className="flex items-center gap-2 px-4 py-2 bg-white hover:bg-stone-50 border border-[#e5e7eb] rounded-full text-xs font-semibold text-[#4f525c] transition-all shadow-sm active:scale-95"
                  >
                    <Icon name="shopping" size={14} className="stroke-[#4078f2]" />
                    <span>Shopping List ({stats.emptyItems + stats.lowItems})</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Scrollable Main Cards View */}
            <div className="flex-1 overflow-y-auto p-8">
              
              {/* Context Banner */}
              <div className="mb-6 flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h2 className="text-xl font-bold text-[#24252a] tracking-tight">
                    {selectedNav === 'all' ? 'All Home Supplies' : rooms.find(r => r.id === selectedNav)?.name}
                  </h2>
                  <p className="text-xs text-[#6a6c76] mt-0.5">
                    Click <span className="font-semibold text-[#4078f2]">+</span> to purchase or add stock, and <span className="font-semibold text-[#e45649]">-</span> when consumed.
                  </p>
                </div>

                {/* Legend indicator based on Atom One Light palette */}
                <div className="flex items-center gap-4 text-xs font-medium text-[#6a6c76] bg-white px-4 py-2 rounded-2xl border border-[#e5e7eb] shadow-sm">
                  <span className="text-[11px] font-semibold text-[#91939d] uppercase tracking-wide">Stock Levels:</span>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#50a14f]"></span>
                    <span>High (&gt;60%)</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#c18401]"></span>
                    <span>Medium (20-60%)</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#e45649]"></span>
                    <span>Low (&lt;20%)</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#a0a1a7]"></span>
                    <span>Empty (0)</span>
                  </div>
                </div>
              </div>

              {/* Responsive Grid Layout */}
              {filteredRooms.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 bg-white rounded-3xl border border-dashed border-[#e5e7eb] text-center">
                  <div className="w-12 h-12 rounded-full bg-stone-100 flex items-center justify-center text-stone-400 mb-3">
                    <Icon name="search" size={24} />
                  </div>
                  <h3 className="font-bold text-base text-[#383a42]">No resources match your filter</h3>
                  <p className="text-xs text-[#91939d] mt-1 max-w-sm">
                    Try adjusting your search query or reset the quick filters to view your room inventory.
                  </p>
                  <button
                    onClick={() => { setSearchQuery(''); setQuickFilter('all'); setSelectedNav('all'); }}
                    className="mt-4 px-4 py-2 rounded-full bg-[#4078f2] text-white text-xs font-semibold shadow-sm hover:bg-[#3467d3]"
                  >
                    Reset All Filters
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start">
                  {filteredRooms.map((room) => (
                    <RoomCard
                      key={room.id}
                      room={room}
                      onIncrease={(itemId) => handleIncrease(room.id, itemId)}
                      onDecrease={(itemId) => handleDecrease(room.id, itemId)}
                      onRestockRoom={() => handleRestockRoom(room.id)}
                    />
                  ))}
                </div>
              )}
            </div>

            {/* Notification Toast Alert */}
            {notificationToast && (
              <div className="fixed bottom-6 right-8 bg-[#24252a] text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-xs font-medium z-50 animate-bounce">
                {notificationToast.type === 'alert' ? (
                  <span className="text-[#e45649]"><Icon name="alert" size={16} /></span>
                ) : (
                  <span className="text-[#50a14f]"><Icon name="check" size={16} /></span>
                )}
                <span>{notificationToast.msg}</span>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Room Card Component
    function RoomCard({ room, onIncrease, onDecrease, onRestockRoom }) {
      const totalItems = room.items.length;
      const lowCount = room.items.filter(i => {
        const pct = (i.qty / i.maxQty) * 100;
        return i.qty === 0 || pct < 20;
      }).length;

      return (
        <div className="bg-white rounded-2xl border border-[#e5e7eb] shadow-sm hover:shadow-md transition-all-card overflow-hidden flex flex-col">
          {/* Card Header */}
          <div className="px-5 pt-4 pb-3 flex items-center justify-between border-b border-[#f3f4f6] bg-[#fafafa]/50">
            <div className="flex items-center gap-2.5">
              <div className={`p-2 rounded-xl border ${room.badgeColor}`}>
                <Icon name={room.icon} size={18} />
              </div>
              <div>
                <h3 className="font-bold text-sm text-[#24252a]">{room.name}</h3>
                <span className="text-[11px] text-[#6a6c76]">
                  {totalItems} tracked item{totalItems !== 1 ? 's' : ''}
                </span>
              </div>
            </div>

            {/* Quick Room Menu / Action */}
            <div className="flex items-center gap-1.5">
              {lowCount > 0 ? (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-50 text-[#e45649] border border-rose-200">
                  {lowCount} Low
                </span>
              ) : (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-[#50a14f] border border-emerald-200">
                  Stocked
                </span>
              )}
              <button
                onClick={onRestockRoom}
                title="Restock all items in this room to full"
                className="text-[11px] px-2 py-1 rounded-full text-[#4078f2] hover:bg-blue-50 font-medium transition-all"
              >
                Max All
              </button>
            </div>
          </div>

          {/* Card Content: List of Resource Item Rows */}
          <div className="p-4 space-y-3 divide-y divide-gray-50">
            {room.items.length === 0 ? (
              <p className="text-xs text-[#91939d] italic py-2 text-center">No items matching filter.</p>
            ) : (
              room.items.map((item) => (
                <ResourceItemRow
                  key={item.id}
                  item={item}
                  onIncrease={() => onIncrease(item.id)}
                  onDecrease={() => onDecrease(item.id)}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    // Resource Item Row Component
    function ResourceItemRow({ item, onIncrease, onDecrease }) {
      const percentage = Math.min(100, Math.round((item.qty / item.maxQty) * 100));
      const isEmpty = item.qty === 0;

      // Estimated days calculation
      const daysLeft = Math.round(item.qty * item.daysPerUnit);

      // Color logic per prompt instructions:
      // Green (High stock > 60%), Pastel Yellow (Medium stock 20-60%), Pastel Red (Low stock < 20%)
      let progressColor = 'bg-[#50a14f]'; // Green
      let statusTextColor = 'text-[#50a14f]';
      let statusLabel = 'High Stock';

      if (isEmpty) {
        progressColor = 'bg-transparent';
        statusTextColor = 'text-[#a0a1a7]';
        statusLabel = 'Out of Stock';
      } else if (percentage < 20) {
        progressColor = 'bg-[#e45649]'; // Pastel Red
        statusTextColor = 'text-[#e45649]';
        statusLabel = 'Critically Low';
      } else if (percentage <= 60) {
        progressColor = 'bg-[#c18401]'; // Pastel Amber/Yellow
        statusTextColor = 'text-[#c18401]';
        statusLabel = 'Moderate';
      }

      return (
        <div
          className={`pt-3 first:pt-0 transition-all rounded-xl p-2 -mx-1 ${
            isEmpty
              ? 'bg-[#f4f5f7] border border-[#e5e7eb] text-[#a0a1a7]'
              : 'hover:bg-[#fbfcfd]'
          }`}
        >
          {/* Top Row: Item Name, Category, Days Left and Quantity */}
          <div className="flex items-center justify-between gap-2 mb-1.5">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className={`font-semibold text-xs truncate ${isEmpty ? 'line-through text-[#8b8d97]' : 'text-[#24252a]'}`}>
                  {item.name}
                </span>
                <span className={`text-[10px] px-1.5 py-0.2 rounded font-medium ${
                  isEmpty ? 'bg-gray-200 text-gray-500' : 'bg-gray-100 text-[#6a6c76]'
                }`}>
                  {item.category}
                </span>
              </div>
              
              <div className="flex items-center gap-2 text-[11px] text-[#6a6c76] mt-0.5">
                {isEmpty ? (
                  <span className="text-[#e45649] font-medium flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-[#e45649]"></span>
                    Depleted • Need to buy!
                  </span>
                ) : (
                  <span>
                    Est. <strong className={statusTextColor}>{daysLeft} days</strong> left ({item.qty} {item.unit})
                  </span>
                )}
              </div>
            </div>

            {/* Interactive Quantity Control Icon Buttons */}
            <div className="flex items-center gap-1.5 flex-shrink-0">
              {/* '-' Button (Use) */}
              <button
                onClick={onDecrease}
                disabled={isEmpty}
                title={isEmpty ? 'Item is empty' : 'Use one unit (-)'}
                className={`w-7 h-7 rounded-full flex items-center justify-center transition-all ${
                  isEmpty
                    ? 'opacity-40 cursor-not-allowed bg-gray-200 text-gray-400'
                    : 'bg-white hover:bg-rose-50 text-[#e45649] border border-[#e5e7eb] hover:border-rose-200 shadow-sm active:scale-90'
                }`}
              >
                <Icon name="minus" size={13} />
              </button>

              {/* Quantity display pill */}
              <div className={`min-w-[34px] px-1.5 py-0.5 text-center text-xs font-mono font-bold rounded-md ${
                isEmpty ? 'bg-gray-200 text-gray-500' : 'bg-stone-100 text-[#24252a]'
              }`}>
                {item.qty}
              </div>

              {/* '+' Button (Add/Buy) */}
              <button
                onClick={onIncrease}
                title="Add/Buy one unit (+)"
                className="w-7 h-7 rounded-full bg-white hover:bg-emerald-50 text-[#50a14f] border border-[#e5e7eb] hover:border-emerald-200 shadow-sm flex items-center justify-center transition-all active:scale-90"
              >
                <Icon name="plus" size={13} />
              </button>
            </div>
          </div>

          {/* Thin Progress Bar below item */}
          <div className="w-full bg-[#e9ecef] h-1.5 rounded-full overflow-hidden mt-2 relative">
            <div
              style={{ width: `${percentage}%` }}
              className={`h-full rounded-full transition-all duration-300 ${progressColor}`}
            />
          </div>

          {/* Micro status info */}
          <div className="flex justify-between items-center text-[10px] text-[#91939d] mt-1 font-mono">
            <span>{percentage}% in stock</span>
            <span>Max: {item.maxQty}</span>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
