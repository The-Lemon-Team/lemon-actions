[package]
name = "lemon-dock"
version = "0.1.0"
description = "Lemon Dock — Quick-Access Launcher for the Lemon Stack"
authors = ["Lemon Stack"]
edition = "2021"

[lib]
name = "lemon_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
