services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lemon:secret@postgres:5432/lemon_db
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lemon_db
    ports:
      - "5432:5432"
    volumes:
      - lemon_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lemon_dev_pgdata:
