services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lemon:secret@postgres:5432/lemon_db
      NATS_URL: nats://nats:4222
      LEMON_BUS_DRIVER: auto
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lemon_db
    ports:
      - "5432:5432"
    volumes:
      - lemon_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - lemon_dev_natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lemon_dev_pgdata:
  lemon_dev_natsdata:
