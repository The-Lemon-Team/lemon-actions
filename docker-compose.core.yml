services:
  postgres:
    image: postgres:15-alpine
    container_name: lemon-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-lemon_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lemon_core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: lemon-core-api:latest
    container_name: lemon-core-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-lemon_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AUTO_SEED: ${AUTO_SEED:-true}
      PROJECTARIUM_LOCALHOST_ALIAS: ${PROJECTARIUM_LOCALHOST_ALIAS:-host.docker.internal}
      LEMON_SEASONS_URL: ${LEMON_SEASONS_URL:-http://host.docker.internal:3001}
      LEMON_MEDIA_HUB_URL: ${LEMON_MEDIA_HUB_URL:-http://host.docker.internal:3005}
      LEMON_AI_SERVICE_URL: ${LEMON_AI_SERVICE_URL:-http://host.docker.internal:3006}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LEMON_BUS_DRIVER: ${LEMON_BUS_DRIVER:-auto}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,nats,host.docker.internal,192.168.1.100}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,postgres,nats,host.docker.internal,192.168.1.100}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_CONFIG: ${WEB_BUILD_CONFIG:-production}
    image: lemon-core-web:latest
    container_name: lemon-core-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT_HTTP:-80}:80"
      - "${WEB_PORT_ALT:-4201}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    container_name: lemon-core-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - lemon_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lemon_core_pgdata:
  lemon_nats_data:
